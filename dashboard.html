<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊組管理系統 Pro+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-active { background: #334155; border-left: 4px solid #60a5fa; font-weight: bold; }
        .table-container { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 250px); border-radius: 1rem; }
        table { min-width: 1600px; } 
        th { cursor: pointer; position: sticky; top: 0; z-index: 20; background: #f8fafc; white-space: nowrap; }
        th:hover { background: #f1f5f9; }
        #editModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden text-slate-900">

    <div id="editModal" class="items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-5xl w-full shadow-2xl modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-2xl font-black">詳細資料編輯</h3>
                <span id="displayId" class="text-sm font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-500"></span>
            </div>
            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm"></div>
            <div class="flex space-x-4 mt-10 border-t pt-6">
                <button id="closeModalBtn" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold">取消</button>
                <button id="saveEditBtn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg">儲存變更</button>
            </div>
        </div>
    </div>

    <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col shadow-2xl shrink-0">
        <div class="p-6 border-b border-slate-700 font-black text-xl">註冊組管理</div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <button data-target="dashboardPanel" class="menu-btn w-full text-left p-3 rounded sidebar-active">📊 數據統計</button>
            <button data-target="managePanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗂️ 學生管理</button>
            <button data-target="classPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">✏️ 編班比對</button>
            <button data-target="importPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">📥 匯入/測試</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <section id="dashboardPanel" class="panel-section block h-full p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-black">數據統計概況</h2>
                <button onclick="location.reload()" class="bg-white px-4 py-2 rounded shadow text-xs hover:bg-gray-100">🔄 刷新頁面</button>
            </div>
            
            <div id="statSummary" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-2xl border-b-4 border-blue-500 shadow-sm"><p class="text-xs text-gray-400">總人數</p><p id="statTotal" class="text-3xl font-black">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-green-500 shadow-sm"><p class="text-xs text-gray-400">已報到</p><p id="statDone" class="text-3xl font-black text-green-600">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-red-500 shadow-sm"><p class="text-xs text-gray-400">未報到</p><p id="statPending" class="text-3xl font-black text-red-600">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-yellow-500 shadow-sm"><p class="text-xs text-gray-400">其它(出國/私校)</p><p id="statOther" class="text-3xl font-black text-yellow-600">0</p></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-96">
                <div class="bg-white p-6 rounded-2xl border flex flex-col">
                    <h4 class="font-bold mb-4">報到狀態比例</h4>
                    <div class="flex-1 min-h-0"><canvas id="anaPieChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl border flex flex-col">
                    <h4 class="font-bold mb-4">各班人數統計</h4>
                    <div class="flex-1 min-h-0"><canvas id="anaBarChart"></canvas></div>
                </div>
            </div>
        </section>

        <section id="managePanel" class="panel-section hidden h-full p-8 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black">學生名冊 (可左右滑動)</h2>
                <div class="flex space-x-2">
                    <input type="text" id="searchInput" placeholder="搜尋姓名/身分證..." class="border px-4 py-2 rounded-xl text-sm outline-none focus:border-blue-500">
                    <button id="exportBtn" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm">匯出 Excel</button>
                </div>
            </div>

            <div class="bg-white flex-1 rounded-2xl shadow-sm border table-container">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b">
                            <th class="p-4" onclick="toggleSort('報到狀態')">報到狀態 ↕️</th>
                            <th class="p-4" onclick="toggleSort('班級')">班級 ↕️</th>
                            <th class="p-4" onclick="toggleSort('座號')">座號 ↕️</th>
                            <th class="p-4" onclick="toggleSort('姓名')">姓名 ↕️</th>
                            <th class="p-4">身分證號</th>
                            <th class="p-4">出生日期</th>
                            <th class="p-4">本土語</th>
                            <th class="p-4">聯絡電話</th>
                            <th class="p-4">通訊地址</th>
                            <th class="p-4">戶籍地址</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y cursor-pointer"></tbody>
                </table>
            </div>
        </section>
        
        <section id="classPanel" class="panel-section hidden p-10 h-full overflow-y-auto">
             <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl border">
                <h2 class="text-xl font-bold mb-4">✏️ 貼上名單編班比對</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <input type="text" id="inputClassName" placeholder="輸入班級 (如 101)" class="w-full border p-3 rounded-xl mb-4 outline-none">
                        <textarea id="rawNameList" rows="10" class="w-full border p-3 rounded-xl font-mono text-sm" placeholder="01 黃于恩"></textarea>
                        <button id="matchNamesBtn" class="w-full mt-4 bg-blue-600 text-white py-4 rounded-xl font-bold">執行比對</button>
                    </div>
                    <div id="matchLog" class="bg-slate-50 p-4 rounded-xl border text-xs h-80 overflow-y-auto"></div>
                </div>
            </div>
        </section>

        <section id="importPanel" class="panel-section hidden p-10 text-center">
            <div class="max-w-md mx-auto space-y-6">
                 <button id="createTestStudentBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">建立測試生 (T123456789)</button>
                 <div class="bg-white p-6 rounded-2xl border shadow-sm text-left">
                    <h3 class="font-bold mb-2 text-sm">2. 匯入 Excel 檔案</h3>
                    <input type="file" id="excelFile" class="mb-4 w-full text-xs">
                    <button id="importBtn" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">執行匯入</button>
                 </div>
                 <div class="pt-10">
                    <input type="text" id="resetInput" placeholder="輸入「確認清空」" class="border p-2 rounded mb-2 text-center w-full text-sm">
                    <button id="resetBtn" class="w-full bg-red-600 text-white py-2 rounded font-bold opacity-20" disabled>刪除所有學生</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
