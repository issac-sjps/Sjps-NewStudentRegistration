<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新莊國小 - 註冊組管理系統 Pro+ (高級版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-active { background: #334155; border-left: 4px solid #60a5fa; font-weight: bold; }
        .table-container { overflow: auto; max-height: calc(100vh - 300px); border-radius: 1rem; border: 1px solid #e2e8f0; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        th { cursor: pointer; position: sticky; top: 0; z-index: 20; background: #f8fafc; white-space: nowrap; border-bottom: 2px solid #e2e8f0; padding: 1rem; font-size: 13px; }
        td { white-space: nowrap; padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; }
        .column-hidden { display: none !important; }
        #authOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #editModal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { max-height: 90vh; overflow-y: auto; width: 95%; max-width: 1100px; border-radius: 2rem; }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden text-slate-900">

    <div id="authOverlay">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-xl font-black">🔒 安全驗證中...</p>
    </div>

    <div id="editModal">
        <div class="bg-white p-8 shadow-2xl modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-2xl font-black text-blue-600">📝 學生資料完整編輯</h3>
                <span id="displayId" class="text-sm font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-500"></span>
            </div>
            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 text-sm"></div>
            <div class="flex space-x-4 mt-10 border-t pt-6">
                <button id="closeModalBtn" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold">取消</button>
                <button id="exportSingleBtn" class="flex-1 py-4 bg-green-100 text-green-700 rounded-2xl font-bold border border-green-200">匯出此生 Excel</button>
                <button id="saveEditBtn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg">儲存變更</button>
            </div>
        </div>
    </div>

    <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col shadow-2xl shrink-0">
        <div class="p-6 border-b border-slate-700 font-black text-xl tracking-widest text-center">🏫 新莊國小管理</div>
        <nav class="flex-1 px-4 space-y-1 text-sm mt-4">
            <button data-target="dashboardPanel" class="menu-btn w-full text-left p-3 rounded sidebar-active">📊 數據統計概況</button>
            <button data-target="searchPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🔍 學生精確查詢</button>
            <button data-target="managePanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗂️ 學生名冊管理</button>
            <button data-target="langPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗣️ 本土語言統計</button>
            <button data-target="classPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">✏️ 編班自動比對</button>
            <button data-target="importPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">📥 數據匯入重置</button>
            
            <div class="pt-6 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 border-t border-slate-700 mt-4">系統導航</div>
            <a href="index.html" class="block p-3 rounded hover:bg-blue-900 text-blue-300">🏠 返回報到首頁</a>
            <a href="admin.html" class="block p-3 rounded hover:bg-slate-700 text-slate-400">⚙️ 管理員白名單</a>
            <button onclick="logout()" class="w-full text-left p-3 rounded hover:bg-red-900 text-red-400">🚪 安全登出</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        
        <section id="searchPanel" class="panel-section hidden h-full p-8 flex flex-col items-center">
            <div class="w-full max-w-2xl bg-white p-10 rounded-3xl shadow-xl border text-center">
                <h2 class="text-3xl font-black mb-2">🔍 學生快速查詢</h2>
                <p class="text-slate-400 mb-8 text-sm">輸入 姓名 或 身分證字號 查找單一學生資料</p>
                <div class="flex space-x-2">
                    <input type="text" id="quickSearchInput" placeholder="例如：黃小明 或 T123456789" class="flex-1 border-2 border-slate-200 p-4 rounded-2xl text-lg outline-none focus:border-blue-500 transition">
                    <button id="quickSearchBtn" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg hover:bg-blue-700">搜尋</button>
                </div>
                <div id="searchResultArea" class="mt-8 hidden">
                    </div>
            </div>
        </section>

        <section id="managePanel" class="panel-section hidden h-full p-8 flex flex-col">
            <div class="mb-6 bg-white p-4 rounded-2xl shadow-sm border">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-2xl font-black">學生名冊管理</h2>
                        <p class="text-[10px] text-slate-400">點選下方按鈕可隱藏/顯示特定欄位</p>
                    </div>
                    <input type="text" id="tableFilter" placeholder="過濾名冊..." class="border px-4 py-2 rounded-xl text-sm w-64 shadow-inner outline-none">
                </div>
                <div id="columnToggleArea" class="flex flex-wrap gap-2"></div>
            </div>
            
            <div class="bg-white flex-1 rounded-2xl shadow-sm border table-container">
                <table id="mainStudentTable">
                    <thead id="mainTableHeader"></thead>
                    <tbody id="mainTableBody" class="divide-y cursor-pointer"></tbody>
                </table>
            </div>
        </section>

        <section id="dashboardPanel" class="panel-section block h-full p-8 overflow-y-auto">
            <h2 class="text-3xl font-black mb-6">報到統計概況</h2>
            <div id="statCards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8"></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-96">
                <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col"><h4 class="font-bold mb-4">報到比例</h4><canvas id="anaPieChart"></canvas></div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col"><h4 class="font-bold mb-4">班級人數</h4><canvas id="anaBarChart"></canvas></div>
            </div>
        </section>
        
        <section id="langPanel" class="panel-section hidden h-full p-8 overflow-y-auto">
            <h2 class="text-3xl font-black mb-6">🗣️ 本土語言統計</h2>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl border shadow-sm h-80 flex flex-col"><canvas id="langPieChart"></canvas></div>
                <div id="langListContainer" class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
            <div id="langGroupingTable" class="bg-white rounded-2xl border shadow-sm p-6 space-y-6"></div>
        </section>

        <section id="classPanel" class="panel-section hidden p-10 h-full overflow-y-auto">
            <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl border">
                <h2 class="text-xl font-bold mb-4 text-blue-600">✏️ 自動編班比對</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <input type="text" id="inputClassName" placeholder="輸入班級 (如 101)" class="w-full border p-3 rounded-xl mb-4">
                        <textarea id="rawNameList" rows="10" class="w-full border p-3 rounded-xl font-mono text-xs" placeholder="01 姓名..."></textarea>
                        <button id="matchNamesBtn" class="w-full mt-4 bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700">執行比對寫入</button>
                    </div>
                    <div id="matchLog" class="bg-slate-900 text-green-400 p-4 rounded-xl font-mono text-[10px] h-80 overflow-y-auto shadow-inner"></div>
                </div>
            </div>
        </section>

        <section id="importPanel" class="panel-section hidden p-10 text-center">
            <div class="max-w-md mx-auto space-y-6">
                <div class="bg-white p-6 rounded-2xl border shadow-sm text-left">
                    <h3 class="font-bold mb-2">Excel 大宗匯入</h3>
                    <input type="file" id="excelFile" class="mb-4 w-full text-xs">
                    <button id="importBtn" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">執行匯入</button>
                </div>
                <div class="pt-20 border-t">
                    <input type="text" id="resetInput" placeholder="請輸入「確認清空」" class="border p-2 rounded mb-2 text-center w-full text-sm shadow-inner">
                    <button id="resetBtn" class="w-full bg-red-600 text-white py-2 rounded font-bold opacity-20" disabled>刪除全體學生資料</button>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
