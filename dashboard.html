<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新莊國小 - 註冊組管理系統 Pro+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-active { background: #334155; border-left: 4px solid #60a5fa; font-weight: bold; }
        .table-container { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 250px); border-radius: 1rem; }
        table { min-width: 1400px; border-collapse: separate; border-spacing: 0; }
        th { cursor: pointer; position: sticky; top: 0; z-index: 20; background: #f8fafc; white-space: nowrap; border-bottom: 2px solid #e2e8f0; font-size: 13px; }
        #editModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { max-height: 85vh; overflow-y: auto; width: 95%; max-width: 1000px; }
        .badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: bold; border: 1px solid transparent; }
        .bg-online { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .bg-pending { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
        .text-school { color: #2563eb; font-weight: 800; text-decoration: underline; }
        .lang-card { border-left: 4px solid #8b5cf6; }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden text-slate-900">

    <div id="editModal">
        <div class="bg-white rounded-3xl p-8 shadow-2xl modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-2xl font-black">詳細資料編輯</h3>
                <span id="displayId" class="text-sm font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-500"></span>
            </div>
            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm"></div>
            <div class="flex space-x-4 mt-10 border-t pt-6">
                <button id="closeModalBtn" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold">取消</button>
                <button id="saveEditBtn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg">儲存變更</button>
            </div>
        </div>
    </div>

    <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col shadow-2xl shrink-0">
        <div class="p-6 border-b border-slate-700 font-black text-xl tracking-widest text-center">🏫 新莊國小</div>
        <nav class="flex-1 px-4 space-y-1 text-sm mt-4">
            <button data-target="dashboardPanel" class="menu-btn w-full text-left p-3 rounded sidebar-active">📊 數據統計</button>
            <button data-target="langPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗣️ 本土語言選修</button>
            <button data-target="managePanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗂️ 學生名冊</button>
            <button data-target="classPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">✏️ 編班比對</button>
            <button data-target="importPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">📥 匯入/重置</button>
            
            <div class="pt-6 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2">外部連結</div>
            <a href="index.html" class="block p-3 rounded hover:bg-blue-900 text-blue-300">🏠 前往報到首頁</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        
        <section id="dashboardPanel" class="panel-section block h-full p-8 overflow-y-auto">
            <h2 class="text-3xl font-black mb-6">報到數據概況</h2>
            <div id="statCards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-96">
                <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col">
                    <h4 class="font-bold mb-4">報到比例</h4>
                    <div class="flex-1"><canvas id="anaPieChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col">
                    <h4 class="font-bold mb-4">班級人數</h4>
                    <div class="flex-1"><canvas id="anaBarChart"></canvas></div>
                </div>
            </div>
        </section>

        <section id="langPanel" class="panel-section hidden h-full p-8 overflow-y-auto">
            <h2 class="text-3xl font-black mb-6">🗣️ 本土語言選修統計</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border shadow-sm h-96 flex flex-col">
                    <h4 class="font-bold mb-4">語言類別比例</h4>
                    <div class="flex-1"><canvas id="langPieChart"></canvas></div>
                </div>
                
                <div id="langListContainer" class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div class="mt-8 bg-white rounded-2xl border shadow-sm p-6">
                <h4 class="font-bold mb-4">語言選修名冊 (按類別分組)</h4>
                <div id="langGroupingTable" class="space-y-6">
                    </div>
            </div>
        </section>

        <section id="managePanel" class="panel-section hidden h-full p-8 flex flex-col">
             <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black">學生名冊</h2>
                <input type="text" id="searchInput" placeholder="搜尋..." class="border px-4 py-2 rounded-xl text-sm w-64">
            </div>
            <div class="bg-white flex-1 rounded-2xl shadow-sm border table-container">
                <table class="w-full text-left text-sm"><thead id="tableHead"></thead><tbody id="studentTableBody"></tbody></table>
            </div>
        </section>

        </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
