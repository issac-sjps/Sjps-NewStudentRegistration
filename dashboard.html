<main class="flex-1 overflow-hidden flex flex-col">
    
    <section id="dashboardPanel" class="panel-section p-8 overflow-y-auto">
        <h2 class="text-3xl font-black mb-6">數據概況</h2>
        <div id="statCards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-96 mb-10">
            <div class="bg-white p-6 rounded-3xl border shadow-sm flex flex-col">
                <h4 class="font-bold mb-4">報到比例</h4>
                <div class="flex-1"><canvas id="anaPieChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border shadow-sm flex flex-col">
                <h4 class="font-bold mb-4">各班報到人數</h4>
                <div class="flex-1"><canvas id="anaBarChart"></canvas></div>
            </div>
        </div>
    </section>

    <section id="langPanel" class="panel-section hidden p-8 overflow-y-auto">
        <h2 class="text-3xl font-black mb-6">🗣️ 本土語言統計</h2>
        <div id="langList" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"></div>
        <div id="langGroups" class="space-y-6 bg-white p-6 rounded-3xl border shadow-sm">
            <h4 class="font-bold border-b pb-2 mb-4">選修名單彙整</h4>
            <div id="langGroupContent"></div>
        </div>
    </section>

    <section id="classPanel" class="panel-section hidden p-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-[3rem] shadow-xl border">
            <h2 class="text-2xl font-black mb-6 text-blue-600">✏️ 自動編班比對</h2>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <input type="text" id="targetClass" placeholder="目標班級 (如 101)" class="w-full border-2 p-4 rounded-2xl mb-4">
                    <textarea id="rawList" rows="10" class="w-full border-2 p-4 rounded-2xl font-mono text-sm" placeholder="格式：01 姓名"></textarea>
                    <button id="runMatchBtn" class="w-full mt-4 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">執行比對並寫入</button>
                </div>
                <div id="matchLog" class="bg-slate-900 text-green-400 p-6 rounded-2xl font-mono text-xs h-96 overflow-y-auto shadow-inner">
                    等待操作...
                </div>
            </div>
        </div>
    </section>

    </main>
