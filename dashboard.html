<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊組管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-active { background: #334155; border-left: 4px solid #60a5fa; font-weight: bold; }
        .table-scroll { overflow-y: auto; max-height: calc(100vh - 250px); }
        /* 彈窗樣式修正 */
        #editModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <div id="editModal" class="items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">修改學生資料</h3>
            <div class="space-y-4">
                <input type="hidden" id="editId">
                <div><label class="text-xs font-bold text-gray-400">姓名</label><input type="text" id="editName" class="w-full border p-2 rounded-xl"></div>
                <div>
                    <label class="text-xs font-bold text-gray-400">報到狀態</label>
                    <select id="editStatus" class="w-full border p-2 rounded-xl">
                        <option value="未報到">未報到</option>
                        <option value="線上報到">線上報到</option>
                        <option value="出國">出國</option>
                        <option value="遷徙">遷徙</option>
                        <option value="私校">就讀私校</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="text-xs font-bold text-gray-400">班級</label><input type="text" id="editClass" class="w-full border p-2 rounded-xl"></div>
                    <div><label class="text-xs font-bold text-gray-400">座號</label><input type="text" id="editSeat" class="w-full border p-2 rounded-xl"></div>
                </div>
                <div><label class="text-xs font-bold text-gray-400">聯絡電話</label><input type="text" id="editPhone" class="w-full border p-2 rounded-xl"></div>
            </div>
            <div class="flex space-x-3 mt-8">
                <button id="closeModalBtn" class="flex-1 py-3 bg-slate-100 rounded-2xl font-bold">取消</button>
                <button id="saveEditBtn" class="flex-1 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">儲存修改</button>
            </div>
        </div>
    </div>

    <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col shadow-2xl">
        <div class="p-6 border-b border-slate-700 font-black text-xl">註冊組管理</div>
        <nav class="flex-1 p-4 space-y-2">
            <button data-target="dashboardPanel" class="menu-btn w-full text-left p-3 rounded sidebar-active">📊 統計中心</button>
            <button data-target="managePanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗂️ 學生管理</button>
            <button data-target="classPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">✏️ 編班比對</button>
            <button data-target="importPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">📥 測試/重置</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <section id="dashboardPanel" class="panel-section block h-full p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-black">數據統計</h2>
                <button id="refreshDataBtn" class="bg-white px-4 py-2 rounded shadow text-sm">🔄 刷新</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-2xl border-b-4 border-blue-500 shadow-sm"><p class="text-xs text-gray-400">總人數</p><p id="statTotal" class="text-3xl font-black">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-green-500 shadow-sm"><p class="text-xs text-gray-400">已報到</p><p id="statDone" class="text-3xl font-black text-green-600">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-red-500 shadow-sm"><p class="text-xs text-gray-400">未報到</p><p id="statPending" class="text-3xl font-black text-red-600">0</p></div>
                <div class="bg-white p-6 rounded-2xl border-b-4 border-yellow-500 shadow-sm"><p class="text-xs text-gray-400">出國/私校</p><p id="statOther" class="text-3xl font-black text-yellow-600">0</p></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl border h-80"><canvas id="anaPieChart"></canvas></div>
                <div class="bg-white p-6 rounded-2xl border h-80"><canvas id="anaBarChart"></canvas></div>
            </div>
        </section>

        <section id="managePanel" class="panel-section hidden h-full p-8 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black">學生名單 (點擊修改)</h2>
            </div>
            <div class="bg-white flex-1 rounded-2xl shadow-sm border overflow-hidden">
                <div class="table-scroll">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b sticky top-0">
                            <tr><th class="p-4">狀態</th><th class="p-4">班級-座號</th><th class="p-4">姓名</th><th class="p-4">電話</th></tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y cursor-pointer"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="classPanel" class="panel-section hidden p-10 h-full">
            <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl border">
                <h2 class="text-xl font-bold mb-4">✏️ 貼上名單比對</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <input type="text" id="inputClassName" placeholder="輸入班級" class="w-full border p-3 rounded-xl mb-4">
                        <textarea id="rawNameList" rows="10" class="w-full border p-3 rounded-xl font-mono text-sm" placeholder="01 黃于恩"></textarea>
                        <button id="matchNamesBtn" class="w-full mt-4 bg-blue-600 text-white py-4 rounded-xl font-bold">執行比對</button>
                    </div>
                    <div id="matchLog" class="bg-slate-50 p-4 rounded-xl border text-xs h-80 overflow-y-auto"></div>
                </div>
            </div>
        </section>

        <section id="importPanel" class="panel-section hidden p-10">
            <div class="max-w-md mx-auto space-y-6">
                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-200">
                    <h3 class="font-bold text-blue-800 mb-2">🛠️ 測試模式</h3>
                    <button id="createTestStudentBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">建立測試生 (T123456789)</button>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border">
                    <h3 class="font-bold mb-4 text-center">匯入 Excel</h3>
                    <input type="file" id="excelFile" class="mb-4 w-full">
                    <button id="importBtn" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">執行匯入</button>
                </div>
                <div class="bg-red-50 p-6 rounded-2xl border border-red-200">
                    <input type="text" id="resetInput" placeholder="輸入「確認清空」" class="w-full border p-2 rounded mb-3 text-center">
                    <button id="resetBtn" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold opacity-20" disabled>確認刪除</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
