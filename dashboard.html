<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理 - 新生報到系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-gray-800">

    <aside class="w-64 bg-slate-800 text-white flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <h2 class="text-xl font-bold">新莊註冊組後台</h2>
            <p class="text-sm text-slate-400 mt-1" id="adminUser">登入者: issac@sjps.kh.edu.tw</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button class="w-full text-left p-2 rounded bg-blue-600 hover:bg-blue-500 font-bold">📊 報到儀表板</button>
            <button class="w-full text-left p-2 rounded hover:bg-slate-700">📥 匯入基礎名冊 (Excel)</button>
            <button class="w-full text-left p-2 rounded hover:bg-slate-700">📋 導師分班產出</button>
            <button class="w-full text-left p-2 rounded hover:bg-slate-700 text-red-400 mt-10">⚙️ 系統設定與重置</button>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <button class="w-full bg-slate-700 text-white p-2 rounded hover:bg-slate-600">登出</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <section id="settingsPanel" class="bg-white p-6 rounded-lg shadow-md max-w-3xl">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2">⚙️ 系統設定與年度維護</h2>
            
            <div class="mb-8">
                <h3 class="text-lg font-bold text-gray-700 mb-2">1. 報到系統開放時間</h3>
                <div class="flex items-center space-x-4">
                    <input type="datetime-local" class="border p-2 rounded">
                    <span>至</span>
                    <input type="datetime-local" class="border p-2 rounded">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded font-bold">儲存設定</button>
                </div>
            </div>

            <div class="mb-8 p-4 bg-red-50 border border-red-200 rounded">
                <h3 class="text-lg font-bold text-red-700 mb-2">⚠️ 年度資料重置 (危險操作)</h3>
                <p class="text-sm text-gray-600 mb-4">這將會清空 Firebase 資料庫中所有的學生報到紀錄，通常於新學年度開始前執行。請輸入 <strong class="text-red-600">確認清空2026</strong> 來解鎖按鈕。</p>
                <div class="flex items-center space-x-4">
                    <input type="text" placeholder="輸入確認指令" class="border p-2 rounded w-64 border-red-300">
                    <button class="bg-red-600 text-white px-4 py-2 rounded font-bold opacity-50 cursor-not-allowed" disabled>執行年度資料重置</button>
                </div>
            </div>
        </section>
        
        </main>
    <script type="module" src="js/dashboard.js"></script>
    </body>
</html>
