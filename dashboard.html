<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊組管理系統 Pro+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-active { background: #334155; border-left: 4px solid #60a5fa; font-weight: bold; }
        /* 左右滑動關鍵 CSS */
        .table-container { 
            overflow-x: auto; 
            overflow-y: auto; 
            max-height: calc(100vh - 250px);
            border-radius: 1rem;
        }
        table { min-width: 1500px; } /* 強制表格寬度，確保可以左右橫移 */
        th { cursor: pointer; position: sticky; top: 0; z-index: 20; background: #f8fafc; }
        th:hover { background: #f1f5f9; }
        
        #editModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden text-slate-900">

    <div id="editModal" class="items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-5xl w-full shadow-2xl modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-2xl font-black">詳細資料編輯</h3>
                <span id="displayId" class="text-sm font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-500"></span>
            </div>
            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            <div class="flex space-x-4 mt-10 border-t pt-6">
                <button id="closeModalBtn" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold">取消</button>
                <button id="saveEditBtn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg">儲存變更</button>
            </div>
        </div>
    </div>

    <aside class="w-64 bg-slate-800 text-slate-100 flex flex-col shadow-2xl shrink-0">
        <div class="p-6 border-b border-slate-700 font-black text-xl">註冊組管理</div>
        <nav class="flex-1 p-4 space-y-2">
            <button data-target="dashboardPanel" class="menu-btn w-full text-left p-3 rounded sidebar-active">📊 數據統計</button>
            <button data-target="managePanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">🗂️ 學生管理</button>
            <button data-target="classPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">✏️ 編班比對</button>
            <button data-target="importPanel" class="menu-btn w-full text-left p-3 rounded hover:bg-slate-700">📥 匯入/測試</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <section id="managePanel" class="panel-section hidden h-full p-8 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-2xl font-black">學生名冊</h2>
                    <p class="text-xs text-slate-400">點擊表頭可切換排序 (報到狀態/班級/姓名)</p>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="searchInput" placeholder="關鍵字搜尋..." class="border px-4 py-2 rounded-xl text-sm outline-none focus:border-blue-500">
                    <button id="exportBtn" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm">匯出 Excel</button>
                </div>
            </div>

            <div class="bg-white flex-1 rounded-2xl shadow-sm border table-container">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b">
                            <th class="p-4" onclick="toggleSort('報到狀態')">報到狀態 ↕️</th>
                            <th class="p-4" onclick="toggleSort('班級')">編班 ↕️</th>
                            <th class="p-4" onclick="toggleSort('姓名')">姓名 ↕️</th>
                            <th class="p-4">身分證號</th>
                            <th class="p-4">出生日期</th>
                            <th class="p-4">監護人</th>
                            <th class="p-4">聯絡電話</th>
                            <th class="p-4">本土語</th>
                            <th class="p-4">通訊地址</th>
                            <th class="p-4">戶籍地址</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y cursor-pointer">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="dashboardPanel" class="panel-section block h-full p-8 overflow-y-auto">
             <h2 class="text-3xl font-black mb-6">系統概況</h2>
             <div class="grid grid-cols-4 gap-4 mb-8" id="statSummary"></div>
             <div class="h-80"><canvas id="anaPieChart"></canvas></div>
        </section>
        
        <section id="importPanel" class="panel-section hidden p-10 h-full overflow-y-auto">
             <div class="max-w-md mx-auto space-y-4">
                 <button id="createTestStudentBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">建立測試生</button>
                 <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <input type="file" id="excelFile" class="mb-4 w-full text-sm">
                    <button id="importBtn" class="w-full bg-slate-800 text-white py-3 rounded-2xl font-bold">執行 Excel 匯入</button>
                 </div>
             </div>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
