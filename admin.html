<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>管理員認證 - 新莊國小</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex justify-center items-center p-4">
    <div id="loginSection" class="bg-slate-800 p-10 rounded-3xl shadow-2xl text-center border border-slate-700 w-full max-w-md">
        <h2 class="text-3xl font-black mb-6 text-blue-400">🛡️ 註冊組管理登入</h2>
        <button id="loginBtn" class="bg-white text-slate-900 px-8 py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 hover:bg-slate-200 transition w-full">
            <img src="https://www.google.com/favicon.ico" class="w-5 h-5">
            <span>使用 Google 帳號登入</span>
        </button>
    </div>

    <div id="adminSection" class="hidden bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-700">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-blue-400">⚙️ 白名單設定</h2>
            <button onclick="signOutAuth()" class="text-xs bg-slate-700 px-3 py-1 rounded-lg hover:bg-red-600">登出</button>
        </div>
        <div class="mb-6">
            <label class="block text-sm mb-2 opacity-70">新增授權 Email (如: issac@sjps.kh.edu.tw)</label>
            <div class="flex space-x-2">
                <input type="email" id="newAdminEmail" class="flex-1 p-3 rounded-xl bg-slate-700 border-none outline-none focus:ring-2 focus:ring-blue-500">
                <button id="addAdminBtn" class="bg-blue-600 px-6 rounded-xl font-bold">加入</button>
            </div>
        </div>
        <div class="bg-slate-900 rounded-2xl p-4 h-64 overflow-y-auto border border-slate-700">
            <ul id="adminList" class="space-y-2"></ul>
        </div>
        <a href="dashboard.html" class="block mt-6 bg-green-600 text-center py-4 rounded-2xl font-black hover:bg-green-500 transition shadow-lg">進入統計後台 ➜</a>
    </div>

    <script type="module">
        import { db, auth } from './js/firebase-config.js';
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.signOutAuth = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadAdminList();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminSection').classList.add('hidden');
            }
        });

        function loadAdminList() {
            onSnapshot(collection(db, "admins"), (snap) => {
                const list = document.getElementById('adminList');
                list.innerHTML = '';
                snap.forEach(d => {
                    list.innerHTML += `<li class="flex justify-between items-center p-3 bg-slate-800 rounded-xl text-sm border border-slate-700">
                        <span>${d.id}</span>
                        <button onclick="removeAdmin('${d.id}')" class="text-red-400 font-bold">移除</button>
                    </li>`;
                });
            });
        }

        document.getElementById('addAdminBtn').onclick = async () => {
            const email = document.getElementById('newAdminEmail').value.trim();
            if(email) await setDoc(doc(db, "admins", email.toLowerCase()), { role: "admin" });
            document.getElementById('newAdminEmail').value = '';
        };

        window.removeAdmin = (id) => confirm(`確定移除 ${id}?`) && deleteDoc(doc(db, "admins", id));
    </script>
</body>
</html>
