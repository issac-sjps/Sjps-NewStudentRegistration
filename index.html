<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新莊國小 - 新生報到系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="loginStep" class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-black text-center text-slate-800 mb-8">新生報到登入</h1>
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">新生身分證號</label>
                <input type="text" id="idNumber" placeholder="例如: A123456789" class="w-full px-4 py-4 rounded-xl border-2 uppercase font-mono">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">出生年月日</label>
                <input type="date" id="birthday" class="w-full px-4 py-4 rounded-xl border-2">
            </div>
            <button id="loginBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg">進入報到問卷</button>
        </div>
    </div>

    <div id="surveyStep" class="hidden glass w-full max-w-2xl p-8 rounded-3xl shadow-2xl my-10">
        <h2 class="text-xl font-bold mb-6 border-b pb-4"><span id="displayName" class="text-blue-600">--</span> 同學，您好</h2>
        <form id="enrollForm" class="space-y-8">
            <input type="hidden" id="studentId">
            <section>
                <label class="block font-black mb-3 text-slate-700">1. 本土語文選修</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="p-4 border rounded-xl flex items-center"><input type="radio" name="lang" value="閩南語" class="mr-2" required> 閩南語</label>
                    <label class="p-4 border rounded-xl flex items-center"><input type="radio" name="lang" value="客家語" class="mr-2"> 客家語</label>
                    <label class="p-4 border rounded-xl flex items-center"><input type="radio" name="lang" value="原民語" class="mr-2"> 原民語</label>
                    <label class="p-4 border rounded-xl flex items-center"><input type="radio" name="lang" value="新住民語" class="mr-2"> 新住民語</label>
                </div>
            </section>
            <section>
                <label class="block font-black mb-3 text-slate-700">2. 聯絡資訊</label>
                <input type="tel" id="phone" placeholder="監護人手機" required class="w-full px-4 py-3 border rounded-xl mb-3">
                <input type="text" id="address" placeholder="通訊地址" required class="w-full px-4 py-3 border rounded-xl">
            </section>
            <button type="submit" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg">確認送出報到</button>
        </form>
    </div>

    <div id="successStep" class="hidden glass w-full max-w-md p-10 rounded-3xl shadow-2xl text-center">
        <div class="text-6xl mb-4">✅</div>
        <h2 class="text-2xl font-black mb-4">報到資料已送出</h2>
        <button onclick="location.reload()" class="text-blue-600 font-bold underline">回首頁</button>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const TEST_ID = "T123456789";

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const id = document.getElementById('idNumber').value.trim().toUpperCase();
            const bday = document.getElementById('birthday').value;
            if(!id || !bday) return alert("請輸入完整資料");

            const snap = await getDoc(doc(db, "students", id));
            if (!snap.exists()) return alert("資料庫無此學生");

            const data = snap.data();
            if (data["出生年月日"] !== bday) return alert("生日不符");
            
            // 測試帳號不擋重複報到
            if (data["報到狀態"] === "線上報到" && id !== TEST_ID) {
                return alert("您先前已報到完成！");
            }

            document.getElementById('loginStep').classList.add('hidden');
            document.getElementById('surveyStep').classList.remove('hidden');
            document.getElementById('displayName').innerText = data["姓名"];
            document.getElementById('studentId').value = id;
        });

        document.getElementById('enrollForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const updateData = {
                "報到狀態": "線上報到",
                "本土語言名稱": document.querySelector('input[name="lang"]:checked').value,
                "聯絡電話": document.getElementById('phone').value,
                "通訊地址": document.getElementById('address').value,
                "報到時間": new Date().toLocaleString()
            };
            await updateDoc(doc(db, "students", id), updateData);
            document.getElementById('surveyStep').classList.add('hidden');
            document.getElementById('successStep').classList.remove('hidden');
        });
    </script>
</body>
</html>
